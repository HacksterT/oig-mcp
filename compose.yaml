# Run the same image IBM Code Engine will run, on this machine, for testing with
# any MCP client:
#
#   docker compose up -d --build
#
# Compose reads the values below from `.env`. Only these reach the container, so
# anything else in that file, such as an evaluation API key, stays out of it.
#
# MCP endpoint: http://127.0.0.1:8000/mcp, with Authorization: Bearer <MCP_AUTH_TOKEN>

services:
  oig-mcp:
    build: .
    image: oig-mcp:local
    container_name: oig-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8080"
    # Keeps the usage log when the container is recreated.
    volumes:
      - ./logs:/logs
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      MCP_CLIENT_TOKENS: ${MCP_CLIENT_TOKENS:-}
      MCP_USAGE_LOG: /logs/usage.log
      # Full tool-call traces, capped at 400 MB, on through the hackathon including
      # judging. They hold what people asked and the answers, and vaoig://about says
      # so. Set MCP_TRACE_DIR= (empty) in .env to stop.
      MCP_TRACE_DIR: ${MCP_TRACE_DIR-/logs/traces}
      OIG_DATA_API_BASE_URL: ${OIG_DATA_API_BASE_URL:?set OIG_DATA_API_BASE_URL in .env}
      CF_ACCESS_CLIENT_ID: ${CF_ACCESS_CLIENT_ID:?set CF_ACCESS_CLIENT_ID in .env}
      CF_ACCESS_CLIENT_SECRET: ${CF_ACCESS_CLIENT_SECRET:?set CF_ACCESS_CLIENT_SECRET in .env}
      # The data API's own key, behind Access. Empty if the API doesn't require one.
      OIG_DATA_API_KEY: ${OIG_DATA_API_KEY:-}
      STALE_AFTER_DAYS: ${STALE_AFTER_DAYS:-30}
